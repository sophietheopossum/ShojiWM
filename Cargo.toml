# !tyml @cargo/Cargo
[workspace]
resolver = "2"
members = [
    "src/shojiwm_lib",
    "src/shojiwm",
    "src/shojiwm_rs",
    "src/xdg-desktop-portal-shojiwm",
    "src/shojiwm_minka",
]

# The smithay fork, pinned once for every crate that uses it: bump the rev
# here only, or two copies of smithay end up in one build.
[workspace.dependencies]
# Default features off: each crate names the ones it uses (shojiwm_lib leaves
# out the X11 backend).
smithay = { git = "https://github.com/sophietheopossum/smithay.git", rev = "36d6aecc3bda7f3bf41d1d446fe4e960b22dae5e", default-features = false }
smithay-drm-extras = { git = "https://github.com/sophietheopossum/smithay.git", rev = "36d6aecc3bda7f3bf41d1d446fe4e960b22dae5e", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Iteration profile for the edit-test loop: same optimization level, but
# parallel codegen, no LTO, and incremental rebuilds. Runtime perf is close
# enough for testing; benchmark and tag releases with `release` only.
# Usage: cargo build --profile release-fast -p shoji_wm
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"

# Dev builds: skip full debuginfo (backtraces still symbolize; flip back to
# `debug = true` when a session under gdb is actually needed).
[profile.dev]
debug = "line-tables-only"

# Compile dependencies optimized even in dev builds: smithay and the GL/text
# stack do the heavy lifting at runtime, and sccache keeps their one-time
# cost cheap. The workspace crates stay at opt-level 0 with incremental for
# the fastest possible edit-rebuild loop.
[profile.dev.package."*"]
opt-level = 3

# Build against the sibling smithay checkout (MinkaDE/smithay, i.e. `master`)
# rather than the rev pinned in src/shojiwm/Cargo.toml. The pin is left alone so
# this branch keeps matching the PR branches line for line; delete this section
# to build a standalone checkout. dist/install.sh builds from the repo root, so
# ../smithay resolves in the MinkaDE layout.
[patch."https://github.com/sophietheopossum/smithay.git"]
smithay = { path = "../smithay" }
smithay-drm-extras = { path = "../smithay/smithay-drm-extras" }
